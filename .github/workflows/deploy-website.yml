name: Deploy website

# Builds the Astro/Starlight site in website/ and publishes the static output
# to the `gh-pages` branch of this repo. Configure GitHub Pages to serve from
# the gh-pages branch (Settings → Pages → Source: Deploy from a branch →
# gh-pages / root). The custom domain hordr.chainsquad.com is set via the
# CNAME file in website/public/ (copied to dist/CNAME at build time).

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: write # peaceiris/actions-gh-pages needs to push to gh-pages

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: website

      - name: Build
        run: bun run build
        working-directory: website
        env:
          HORDR_SITE: https://hordr.chainsquad.com

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy website ${{ github.sha }}'
