id = "herdr.hordr"
name = "Hordr"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Give a coding agent an isolated worktree and a pane, with a bean as its brief"
platforms = ["linux", "macos"]

[[actions]]
id = "run"
title = "Run an agent on a bean"
contexts = ["workspace"]
command = ["hordr", "run"]

[[actions]]
id = "cleanup"
title = "Remove a bean's worktree"
contexts = ["workspace"]
command = ["hordr", "cleanup"]

[[actions]]
id = "daemon"
title = "Start the hordr daemon (health stub)"
contexts = ["workspace"]
command = ["hordr", "daemon"]
